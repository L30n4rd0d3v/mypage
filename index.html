<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leonardo Dev - Links Úteis</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #0d1117; /* Fundo escuro tecnológico */
            --accent-glow: #00f2ff; /* Ciano Neon */
            --text-color: #ffffff;
            --button-bg: rgba(13, 17, 23, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu', sans-serif;
            background-color: var(--primary-bg);
            /* Substitua 'seu-fundo-com-caricatura.jpg' pela URL da imagem que gerei */
            background-image: url('seu-fundo-com-caricatura.jpg'); 
            background-size: cover;
            background-position: center bottom;
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--accent-glow);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .links-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            text-decoration: none;
            color: var(--text-color);
            background: var(--button-bg);
            border: 2px solid var(--accent-glow);
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .link-card:hover {
            background: var(--accent-glow);
            color: var(--primary-bg);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
            transform: translateY(-3px);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Estilo para Mobile */
        @media (max-width: 480px) {
            .container {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>LEONARDO DEV</h1>
        </header>

        <nav class="links-area">
            <a href="quemsoueu.html" class="link-card" target="_blank">
                CONHEÇA O LD
            </a>

            <a href="portfolio.html" class="link-card" target="_blank">
                PORTFÓLIO
            </a>

            <a href="https://wa.me/+5567991531530" class="link-card" target="_blank">
                WHATSAPP
            </a>
        </nav>

        <footer>
            @leonardodevoficial
        </footer>
    </div>

</body>
</html>
