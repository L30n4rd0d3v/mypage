    <style>
        :root {
            --bg: #0d1117; /* Fundo Escuro */
            --card-bg: #161b22; /* Fundo do Formulário */
            --accent: #00f2ff; /* Ciano Neon */
            --text: #e6edf3;
            --dim-text: #8b949e;
            --border: rgba(0, 242, 255, 0.2);
            --shadow: 0 10px 40px rgba(0, 242, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Ubuntu', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* --- CONTAINER PRINCIPAL --- */
        .form-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: 0.3s;
            position: relative;
        }

        .form-container:hover { border-color: var(--accent); }

        /* --- CABEÇALHO DO FORMULÁRIO --- */
        header {
            text-align: center;
            padding: 40px 30px 10px 30px;
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        header h1 span { color: var(--accent); }

        header p {
            color: var(--dim-text);
            font-size: 1rem;
        }

        /* --- CAMPOS DO FORMULÁRIO --- */
        form {
            padding: 20px 30px 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--accent);
        }

        input, select, textarea {
            width: 100%;
            padding: 15px;
            background: #21262d;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text);
            font-family: 'Ubuntu', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* --- WHATSAPP COM BANDEIRA --- */
        .whatsapp-wrapper {
            display: flex;
            gap: 10px;
        }

        .country-code {
            flex: 0 0 70px; /* Largura fixa para a bandeira/código */
            padding: 15px 5px;
            text-align: center;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .phone-input { flex-grow: 1; }

        /* --- TEXTAREA E LIMITE --- */
        textarea {
            resize: vertical;
            min-height: 120px;
            max-height: 250px;
        }

        .char-count {
            text-align: right;
            font-size: 0.8rem;
            color: var(--dim-text);
            margin-top: -15px;
        }

        /* --- BOTÃO FINAL --- */
        .btn-submit {
            background: var(--accent);
            color: var(--bg);
            padding: 18px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0, 242, 255, 0.4);
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 30px var(--accent);
        }

        /* --- AVATAR DO LD --- */
        .avatar-area {
            text-align: center;
            margin-top: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        /* --- RESPONSIVIDADE (MOBILE) --- */
        @media (max-width: 480px) {
            .form-container { border-radius: 12px; }
            header { padding: 30px 20px 10px 20px; }
            header h1 { font-size: 1.5rem; }
            form { padding: 15px 20px 30px 20px; }
            .btn-submit { padding: 15px; font-size: 1rem; }
            .whatsapp-wrapper { flex-wrap: wrap; }
            .country-code { flex: 0 0 100%; text-align: left; justify-content: flex-start; gap: 8px; }
        }
    </style>

    // HTML sanitization function to prevent XSS
    function sanitizeHtml(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;')
        .replace(/\//g, '&#x2F;');
    }

    // URL sanitization function to prevent javascript: and data: URLs
    function sanitizeUrl(url) {
      if (typeof url !== 'string') return '';
      const trimmedUrl = url.trim().toLowerCase();
      if (trimmedUrl.startsWith('javascript:') || trimmedUrl.startsWith('data:') || trimmedUrl.startsWith('vbscript:')) {
        return '#';
      }
      return url;
    }

    const getBrowserLanguage = () => {
      if (!window?.navigator?.language?.split('-')[1]) {
        return window?.navigator?.language?.toUpperCase();
      }
      return window?.navigator?.language?.split('-')[1];
    };

    
    function getDefaultCountryProgram(defaultCountryCode, smsProgramData) {
      if (!smsProgramData || smsProgramData.length === 0) {
        return null;
      }

      const browserLanguage = getBrowserLanguage();

      if (browserLanguage) {
        const foundProgram = smsProgramData.find(
          (program) => program?.countryCode === browserLanguage,
        );
        if (foundProgram) {
          return foundProgram;
        }
      }

      if (defaultCountryCode) {
        const foundProgram = smsProgramData.find(
          (program) => program?.countryCode === defaultCountryCode,
        );
        if (foundProgram) {
          return foundProgram;
        }
      }

      return smsProgramData[0];
    }

    function updateSmsLegalText(countryCode, fieldName) {
      if (!countryCode || !fieldName) {
        return;
      }
      
      const programs = window?.MC?.smsPhoneData?.programs;
      if (!programs || !Array.isArray(programs)) {
        return;
      }
      
      const program = programs.find(program => program?.countryCode === countryCode);
      if (!program || !program.requiredTemplate) {
        return;
      }
    
      
      const legalTextElement = document.querySelector('#legal-text-' + fieldName);
      if (!legalTextElement) {
        return;
      }
      
      // Remove HTML tags and clean up the text
      const divRegex = new RegExp('</?[div][^>]*>', 'gi');
      const fullAnchorRegex = new RegExp('<a.*?</a>', 'g');
      const anchorRegex = new RegExp('<a href="(.*?)" target="(.*?)">(.*?)</a>');
      
      const template = program.requiredTemplate.replace(divRegex, '');
      
      

      legalTextElement.textContent = '';
      const parts = template.split(/(<a href=".*?" target=".*?">.*?<\/a>)/g);
      parts.forEach(function(part) {
        if (!part) {
          return;
        }
        const anchorMatch = part.match(/<a href="(.*?)" target="(.*?)">(.*?)<\/a>/);
        if (anchorMatch) {
          const linkElement = document.createElement('a');
          linkElement.href = sanitizeUrl(anchorMatch[1]);
          linkElement.target = sanitizeHtml(anchorMatch[2]);
          linkElement.textContent = sanitizeHtml(anchorMatch[3]);
          legalTextElement.appendChild(linkElement);
        } else {
          legalTextElement.appendChild(document.createTextNode(part));
        }
      });
          
    }

      return programs.map(program => {

        const countryName = getCountryName(program.countryCode);

        // Sanitize all values to prevent XSS

<body>

    <div class="form-container">
        <header>
            <h1>O Seu Próximo <span>Projeto_</span></h1>
            <p>Conte o que você precisa. Vamos criar juntos.</p>
        </header>

        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Leonardo Silva" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail Profissional</label>
                <input type="email" id="email" name="email" placeholder="Ex: leo.dev@email.com" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp / Celular</label>
                <div class="whatsapp-wrapper">
                    <div class="country-code" title="Selecione o código do país">
                        🇧🇷 +55
                    </div>
                    <input type="tel" id="whatsapp" name="whatsapp" class="phone-input" placeholder="(67) 99999-9999" required>
                </div>
            </div>

            <div class="form-group">
                <label for="assunto">O que vamos criar?</label>
                <select id="assunto" name="assunto" required>
                    <option value="" disabled selected>Selecione um assunto...</option>
                    <option value="site">Site Completo</option>
                    <option value="pagina_vendas">Página de Vendas (Alta Conversão)</option>
                    <option value="pagina_captura">Página de Captura (Leads)</option>
                    <option value="area_membros">Área de Membros</option>
                    <option value="apps">Aplicação / App</option>
                    <option value="bio">Bio Personalizada</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Detalhes do Projeto</label>
                <textarea id="mensagem" name="mensagem" maxlength="600" placeholder="Conte resumidamente a sua dor ou o seu objetivo..." required></textarea>
                <div class="char-count">máx. 600 caracteres</div>
            </div>

            <button type="submit" class="btn-submit">Enviar Proposta →</button>

        </form>

        <div class="avatar-area">
            <img src="avatar.jpg" alt="Leonardo Dev" class="avatar">
            <p style="color: var(--dim-text); margin-top: 10px; font-size: 0.9rem;">@leonardodevoficial</p>
        </div>
    </div>
